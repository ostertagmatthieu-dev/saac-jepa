name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff@0.14.0 check .
      - run: uvx ruff@0.14.0 format --check src/cncjepa/__init__.py tests/conftest.py tests/test_smoke.py tests/test_version.py
      - run: uvx --python 3.12 cffconvert --validate

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            requirements.txt
      - run: uv pip install --system --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
      - run: uv pip install --system -e ".[dev]"
      - name: Print environment
        run: python -c "import torch, cncjepa; print(torch.__version__, torch.cuda.is_available(), cncjepa.__version__)"
      - run: python -m pytest --durations=10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: outputs-py${{ matrix.python-version }}
          path: outputs/**/*.json
          if-no-files-found: ignore
