  - s08_torque
  - s09_current
  - s17_production_rate
protocol:
  eval_hz: 1.0
  context_len: 32
  horizons:
  - 1
  - 2
  - 4
  - 8
  - 16
  source_train_fraction: 0.67
  source_val_fraction: 0.17
  target_support_fractions:
  - 0.0
  - 0.05
  - 0.1
  - 0.2
  group_split_key: session_id
  min_points_per_group: 64
  strict_train_only_normalization: true
normalization:
  mode: source_robust
  eps: 1.0e-06
masking:
  mode: random
  ratio: 0.35
  block_min: 2
  block_max: 12
  channel_drop_prob: 0.15
  event_quantile: 0.8
model:
  d_model: 128
  nhead: 8
  encoder_layers: 4
  predictor_layers: 2
  dim_feedforward: 512
  dropout: 0.1
  patch_len: 4
  action_injection: cross_attn
  layernorm: none
  sensor_flexible: true
  probabilistic_head: true
jepa:
  ema: 0.99
  latent_loss: smooth_l1
  latent_weight: 0.25
  latent_layernorm: true
  vicreg_mode: none
  vicreg_weight: 0.0
  vicreg_sim: 25.0
  vicreg_var: 25.0
  vicreg_cov: 1.0
  variance_target: 1.0
  target_aggregation: per_horizon
  action_recovery_weight: 0.2
  schema_consistency_weight: 0.1
  physical_weight: 1.0
train:
  epochs: 100
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.01
  warmup_epochs: 5
  grad_clip: 1.0
  amp: true
  num_workers: 8
  early_stop_patience: 15
search:
  num_random_methods: 20
  seeds:
  - 0
  - 1
  - 2
  selection_metric: val_composite
  test_lock_required: true
planning:
  cem_population: 1024
  cem_elites: 64
  cem_iters: 6
  temperature_limit: 75.0
  wear_limit: 1.0
