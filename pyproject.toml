[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saac-jepa"
dynamic = ["version"]
description = "Schema-Adaptive Action-Conditioned JEPA for cross-machine CNC transfer under partial sensor overlap"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Ayoub Louaye Bouaziz" },
  { name = "Matthieu Ostertag" },
  { name = "Anton Demasles" },
]
keywords = ["jepa", "world-models", "pytorch", "time-series", "cnc", "transfer-learning", "self-supervised-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "PyYAML>=6.0",
  "PyWavelets>=1.6",
  "einops>=0.8",
  "matplotlib>=3.8",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["ruff==0.14.0", "pytest>=8.0", "pre-commit>=3.7", "cffconvert>=2.0"]

[project.urls]
Homepage = "https://ostertagmatthieu-dev.github.io/saac-jepa/"
Repository = "https://github.com/ostertagmatthieu-dev/saac-jepa"
Paper = "https://ostertagmatthieu-dev.github.io/saac-jepa/paper.pdf"
Changelog = "https://github.com/ostertagmatthieu-dev/saac-jepa/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cncjepa*"]

[tool.setuptools.dynamic]
version = { attr = "cncjepa.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party", "paper", "docs", "outputs", "data", ".claude", ".claude-flow"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# The code base deliberately uses a compact one-statement-per-line style (semicolons, one-line
# ifs, lambda assignment). These are style choices of the scientific code, not defects.
ignore = ["E401", "E701", "E702", "E703", "E731"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E501", "F401", "F403", "F405", "I001"]   # `from _common import *` sys.path shim must stay first
"tests/test_p3fix.py" = ["E402", "E501", "F401", "I001"]         # sys.path shim before imports; plain-python test
"examples/*" = ["E402", "E501", "I001"]
"src/cncjepa/**" = ["E501", "I001"]
"src/cncjepa/factory.py" = ["F403", "F405"]              # intentional star import of the baseline registry

[tool.ruff.lint.isort]
known-first-party = ["cncjepa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_p3fix.py is a plain-python script that executes on import and calls sys.exit();
# tests/test_smoke.py runs it through a subprocess instead.
addopts = "-ra --ignore=tests/test_p3fix.py"
markers = ["slow: end-to-end CPU smoke of the core pipeline (scripts/54), a few minutes"]
